services:
  fluxdrop:
    build: .
    container_name: fluxdrop
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      FLUXDROP_HOST: "0.0.0.0"
      FLUXDROP_PORT: "8090"
      FLUXDROP_STORAGE_DIR: "/data"
      FLUXDROP_PUBLIC_URL: "http://allenflux.tech:8090"
      # 上传及文件管理令牌；未设置时，文件管理功能关闭。
      FLUXDROP_UPLOAD_TOKEN: "${FLUXDROP_UPLOAD_TOKEN:-}"
      FLUXDROP_MAX_UPLOAD_MB: "1024"
    volumes:
      - fluxdrop-data:/data

volumes:
  fluxdrop-data:
