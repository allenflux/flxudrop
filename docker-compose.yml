services:
  fluxdrop:
    build: .
    container_name: fluxdrop
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      FLUXDROP_HOST: "0.0.0.0"
      FLUXDROP_PORT: "8090"
      FLUXDROP_STORAGE_DIR: "/data"
      FLUXDROP_PUBLIC_URL: "http://allenflux.tech:8090"
      # 可选：默认上传和文件管理均无需令牌。
      # FLUXDROP_UPLOAD_TOKEN: "change-me"
      FLUXDROP_MAX_UPLOAD_MB: "8192"
      FLUXDROP_COLD_STORAGE_ENABLED: "${FLUXDROP_COLD_STORAGE_ENABLED:-0}"
      FLUXDROP_S3_BUCKET: "${FLUXDROP_S3_BUCKET:-}"
      FLUXDROP_S3_REGION: "${FLUXDROP_S3_REGION:-ap-northeast-3}"
      FLUXDROP_S3_ENDPOINT: "${FLUXDROP_S3_ENDPOINT:-}"
      FLUXDROP_S3_PREFIX: "${FLUXDROP_S3_PREFIX:-fluxdrop-cold/}"
      FLUXDROP_ENCRYPTION_KEY_FILE: "/run/fluxdrop-secrets/keys.json"
      FLUXDROP_ENCRYPTION_KEY_ID: "${FLUXDROP_ENCRYPTION_KEY_ID:-}"
      FLUXDROP_COLD_IDLE_DAYS: "${FLUXDROP_COLD_IDLE_DAYS:-7}"
      FLUXDROP_COLD_BLOCK_MB: "${FLUXDROP_COLD_BLOCK_MB:-32}"
      FLUXDROP_COLD_MAX_OBJECT_MB: "${FLUXDROP_COLD_MAX_OBJECT_MB:-100}"
      FLUXDROP_COLD_DISK_RESERVE_MB: "${FLUXDROP_COLD_DISK_RESERVE_MB:-512}"
      FLUXDROP_COLD_WAIT_SECONDS: "${FLUXDROP_COLD_WAIT_SECONDS:-15}"
      FLUXDROP_COLD_SCAN_SECONDS: "${FLUXDROP_COLD_SCAN_SECONDS:-300}"
      FLUXDROP_COLD_RETRY_BASE_SECONDS: "${FLUXDROP_COLD_RETRY_BASE_SECONDS:-2}"
      FLUXDROP_COLD_RETRY_MAX_SECONDS: "${FLUXDROP_COLD_RETRY_MAX_SECONDS:-300}"
      FLUXDROP_S3_CONNECT_TIMEOUT: "${FLUXDROP_S3_CONNECT_TIMEOUT:-5}"
      FLUXDROP_S3_READ_TIMEOUT: "${FLUXDROP_S3_READ_TIMEOUT:-30}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_SHARED_CREDENTIALS_FILE: "/run/fluxdrop-secrets/aws-credentials"
    volumes:
      - fluxdrop-data:/data
      - "${FLUXDROP_SECRETS_DIR:-./secrets}:/run/fluxdrop-secrets:ro"

volumes:
  fluxdrop-data:
