<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件管理页面示意</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}
main{max-width:1040px;margin:48px auto;padding:0 32px}h1{font-size:32px;line-height:1.3;margin:0 0 12px;font-weight:600;color:#000}h2{font-size:22px;margin:36px 0 12px;color:#000}h3{font-size:17px;margin:24px 0 8px;color:#000}p{margin:10px 0}p.meta,figcaption{font-size:13px;color:#666}figure{margin:24px 0}figcaption{margin-top:12px}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block}table{width:100%;border-collapse:collapse;table-layout:fixed;margin:16px 0 24px;font-size:14px}th,td{border:1px solid #d9d9d9;padding:12px;text-align:left;vertical-align:middle;overflow-wrap:anywhere}th{background:#f4f4f5;color:#000;font-weight:600}td:first-child,th:first-child{width:24%}li{margin:8px 0}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:#f4f4f5;padding:2px 5px;border-radius:4px}a{color:#333;text-underline-offset:3px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;font-size:14px}.manager{margin:0;background:#fff;padding:28px;width:960px;min-width:960px;border:1px solid #ddd;border-radius:6px}.manager h3{margin:0;font-size:28px}.manager .sub{color:#666;font-size:14px}.manager .toolbar{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;gap:16px}.manager .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.manager button{border:1px solid #ccc;border-radius:4px;background:#fff;padding:7px 10px;color:#333;font-family:inherit;font-size:13px}.manager button.cold{background:#333;border-color:#333;color:white}.manager button[disabled]{color:#999;background:#fafafa}.manager table{font-size:14px;margin:0}.manager th,.manager td{padding:16px 10px;border-left:0;border-right:0}.manager th:nth-child(1){width:31%}.manager th:nth-child(2){width:12%}.manager th:nth-child(3){width:21%}.manager th:nth-child(4){width:36%}.manager .badge{display:inline-block;border:1px solid #aaa;border-radius:4px;padding:2px 7px;font-size:12px}.manager .small{font-size:12px;color:#666}.manager .ui-note{font-size:13px;color:#666;margin:20px 0 0}.manager .progress{height:4px;background:#eee;margin-top:8px;max-width:112px}.manager .progress span{display:block;width:65%;height:100%;background:#555}

</style></head><body><main><h1>文件管理页面示意</h1><div class="diagram-container"><div class="manager" id="manager-preview" aria-label="冷热文件管理页面示意">

<div class="toolbar"><span>☑ 已选择 1 项</span><div class="actions"><button>下载所选</button><button class="cold">设为冷文件</button><button>删除所选</button></div></div>
<table><thead><tr><th>文件名称</th><th>大小</th><th>存储状态</th><th>操作</th></tr></thead><tbody>

<tr><td>☐ clip.mp4<br><span class="small">最后访问 12 天前</span></td><td>1.2 GiB</td><td><span class="badge">冷文件</span><br><span class="small">访问后自动恢复</span></td><td><div class="actions"><button>预览</button><button>下载</button><button disabled>已是冷文件</button></div></td></tr>

</tbody></table><p class="ui-note">页面示意　点击设为冷文件后显示等待或进度；上传验证完成并释放本地副本后才显示冷文件。</p></div></div></main></body></html>
